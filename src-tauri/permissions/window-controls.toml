[[permission]]
identifier = "formref-window-configure"
description = "Change main window topmost, fullscreen, native frame and click-through state."
commands.allow = ["window_configure"]

[[permission]]
identifier = "formref-window-state"
description = "Read main window topmost, fullscreen and native frame state."
commands.allow = ["window_state"]

[[permission]]
identifier = "formref-window-layout"
description = "Read and set the main window's position and size, for window layouts saved with a board."
commands.allow = ["window_layout", "window_place"]

[[permission]]
identifier = "formref-app-ready"
description = "Tell the shell the page has painted, so the splash closes and the main window is shown."
commands.allow = ["app_ready"]

[[permission]]
identifier = "formref-window-start-drag"
description = "Move the main window from an explicit drag gesture."
commands.allow = ["window_start_drag"]
