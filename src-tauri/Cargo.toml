[package]
name = "formref-desktop"
version = "0.39.2"
description = "FormRef desktop shell"
authors = ["nodemode-ai <mackin@nodemode.ai>"]
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
tauri = { version = "=2.12.3", features = ["macos-private-api", "tray-icon", "image-png"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "=2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "objc2-core-foundation", "NSColor"] }

[profile.release]
strip = false
lto = true
codegen-units = 1
