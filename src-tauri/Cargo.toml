[package]
name = "formref-desktop"
version = "0.4.8"
description = "FormRef development desktop shell"
authors = ["nodemode-ai <mackin@nodemode.ai>"]
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
tauri = { version = "=2.12.3", features = ["macos-private-api"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "=2.3.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
